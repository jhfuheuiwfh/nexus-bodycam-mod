buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

group = project.maven_group
version = project.mod_version
archivesBaseName = project.archives_base_name

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // TACZ (compile reference only — the names are identical in the Forge TACZ;
    // the mixin is gated by BodycamMixinPlugin and ships inert without TACZ)
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    // Dev run tasks (runClient) — the mod is loaded straight from sourceSets.main
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                bodycam {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "bodycam.refmap.json"
    config "bodycam.mixins.json"
}

// TACZ is an OPTIONAL integration and its jar is third-party, so it is never
// committed (libs/*.jar is gitignored).
//
// TaczBridge.java has no compile-time dependency on TACZ (it resolves the API
// reflectively), but TaczGunTransformMixin.java must @Mixin a TACZ class
// directly, so it can only be compiled when that jar is present. Skip it on a
// clean clone instead of failing the build; BodycamMixinPlugin also refuses to
// apply a Tacz mixin that is not packaged in the jar, so both cases stay safe.
sourceSets {
    main {
        java {
            if (fileTree(dir: 'libs', include: '*.jar').files.isEmpty()) {
                logger.lifecycle('[bodycam] libs/*.jar ausente: compilando SEM o mixin TACZ (integracao opcional).')
                exclude '**/mixin/TaczGunTransformMixin.java'
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    options.release = 17
}

jar {
    finalizedBy 'reobfJar'
    manifest {
        attributes(
            'Specification-Title': 'bodycam',
            'Specification-Vendor': 'stable-user1223',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor': 'stable-user1223'
        )
    }
}

// NOTE: META-INF/mods.toml uses the ${version} token, expanded below to the
// real mod version (do not leave it to FML — ${file.jarVersion} cannot resolve
// in dev runs, where there is no jar manifest).
processResources {
    // track the version as an input so a build.gradle change re-expands the
    // token instead of serving a stale UP-TO-DATE output
    inputs.property "version", project.mod_version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}
