buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.5-SNAPSHOT"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

group = project.maven_group
version = project.mod_version
archivesBaseName = project.archives_base_name

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly fileTree(dir: 'libs', include: '*.jar')
    include "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/bodycam.accesswidener")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    options.release = 17
}

jar {
    manifest {
        attributes(
            'Fabric-Mod-Loader': '>=0.15.11',
            'Fabric-Mod-Environment': 'client'
        )
    }
}

processResources {
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}