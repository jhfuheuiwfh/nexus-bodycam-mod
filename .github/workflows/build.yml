name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `libs/*.jar` holds the third-party TACZ API used ONLY at compile time
      # (modCompileOnly). It is a third-party mod and must never be committed,
      # so a clean clone — including this runner — will not have it.
      #
      # TaczBridge.java and TaczGunTransformMixin.java import com.tacz.* directly,
      # so the source does not compile without it. Detect that up front and skip
      # the jar build instead of failing.
      - name: Check for the TACZ compile-time jar
        id: tacz
        run: |
          if [ -d libs ] && ls libs/*.jar >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Jar build skipped::libs/*.jar is absent (third-party, never committed). TaczBridge imports com.tacz.*, so the jar cannot compile here. Build it locally with the TACZ jar in libs/."
          fi

      - name: Set up JDK 17
        if: steps.tacz.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle deps + wrapper. keyed on the build files so it
      # invalidates automatically when dependencies change.
      - name: Set up Gradle
        if: steps.tacz.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      # `gradlew` is a shell script; Windows checkouts drop its executable bit,
      # so restore it explicitly before invoking.
      - name: Build
        if: steps.tacz.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload artifact
        if: steps.tacz.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-bodycam-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Only when a version tag is pushed: attach the jar to the GitHub Release.
      # Same guard — without the TACZ jar there is no artifact to attach.
      - name: Attach jar to release
        if: steps.tacz.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-site:
    name: Check docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 7
