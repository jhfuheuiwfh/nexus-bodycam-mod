name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle deps + wrapper. keyed on the build files so it
      # invalidates automatically when dependencies change.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # `libs/` holds a third-party TACZ jar that is NOT in the repo, so the
      # build compiles WITHOUT the TACZ bridge. That path is expected and is
      # not a failure.
      - name: Warn if TACZ integration was skipped
        run: |
          if [ ! -d libs ] || [ -z "$(ls -A libs 2>/dev/null | grep -v README.md)" ]; then
            echo "::notice title=TACZ integration::libs/ is empty — the jar builds without TACZ gun realism."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-bodycam-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Only when a version tag is pushed: attach the jar to the GitHub Release.
      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-site:
    name: Check docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 7
