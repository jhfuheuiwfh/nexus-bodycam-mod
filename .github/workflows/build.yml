name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TACZ is an OPTIONAL integration and its jar is third-party, so it is
      # gitignored and never present here. That is fine: TaczBridge resolves the
      # TACZ API reflectively and build.gradle drops TaczGunTransformMixin when
      # libs/ is empty, so the base mod compiles without it. The jar this job
      # produces therefore has no TACZ gun-realism — build locally with the TACZ
      # jar in libs/ if you need that in a release.
      - name: Note TACZ integration status
        run: |
          if [ ! -d libs ] || ! ls libs/*.jar >/dev/null 2>&1; then
            echo "::notice title=TACZ::libs/*.jar absent (third-party, never committed). Building the base mod without TACZ gun realism."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle deps + wrapper. keyed on the build files so it
      # invalidates automatically when dependencies change.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `gradlew` is a shell script; Windows checkouts drop its executable bit,
      # so restore it explicitly before invoking.
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NEXUS-bodycam-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Only when a version tag is pushed: attach the jar to the GitHub Release.
      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-site:
    name: Check docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: _site
          retention-days: 7
